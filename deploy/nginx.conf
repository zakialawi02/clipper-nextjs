# Nginx reverse proxy for AI Clipper
# Deploy to: /etc/nginx/sites-available/clipper
# Enable: ln -s /etc/nginx/sites-available/clipper /etc/nginx/sites-enabled/

upstream clipper_web {
    least_conn;
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name clipper.example.com;

    # Redirect HTTP to HTTPS (uncomment after SSL setup)
    # return 301 https://$host$request_uri;

    # Increase upload limit for video files
    client_max_body_size 500M;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 6;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location /_next/static {
        expires 365d;
        add_header Cache-Control "public, immutable";
        proxy_pass http://clipper_web;
    }

    # API rate limiting (10 req/s burst 20)
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://clipper_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main proxy
    location / {
        proxy_pass http://clipper_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # Long timeout for streaming/SSE
    }
}

# Rate limit zone definition (in nginx.conf http block)
# limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
